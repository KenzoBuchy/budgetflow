services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: budgetflow
      POSTGRES_USER: budgetflow
      POSTGRES_PASSWORD: budgetflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetflow"]
      interval: 5s
      retries: 10

  web:
    build: .
    environment:
      POSTGRES_DB: budgetflow
      POSTGRES_USER: budgetflow
      POSTGRES_PASSWORD: budgetflow
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: