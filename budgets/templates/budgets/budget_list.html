{% extends "budgets/base.html" %}
{% block content %}
<form method="get">
  <input type="number" name="year" placeholder="Year" value="{{ request.GET.year }}">
  <button>Filter</button>
</form>
<table>
  <tr><th>Department</th><th>Year</th><th>Budget</th><th>Spent</th><th>Used</th></tr>
  {% for b in budgets %}
  <tr>
    <td><a href="{% url 'budgets:budget-detail' b.pk %}">{{ b.department.name }}</a></td>
    <td>{{ b.year }}</td>
    <td class="num">{{ b.amount|floatformat:2 }}</td>
    <td class="num">{{ b.spent|floatformat:2 }}</td>
    <td class="num {% if b.remaining < 0 %}over{% endif %}">{% widthratio b.spent b.amount 100 %} %</td>
  </tr>
  {% empty %}
  <tr><td colspan="5">No budget yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
